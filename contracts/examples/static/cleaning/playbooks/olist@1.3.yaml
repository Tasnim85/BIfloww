name: olist
version: '1.3'
source: manual
approved_by: Ikbel
approved_at: '2026-10-20T10:00:00Z'
rules:
- rule_id: R1_drop_duplicate_payments
  table: order_payments
  column: null
  action: drop_duplicates
  params: {}
  description: Delete exact duplicate payment rows (the first one is kept).
- rule_id: R2_cast_purchase_ts
  table: orders
  column: order_purchase_timestamp
  action: cast
  params:
    dtype: datetime64[ns]
  description: Read the purchase timestamp as a date-time.
- rule_id: R3_normalize_city
  table: customers
  column: customer_city
  action: normalize_text
  params:
    case: lower
  description: Remove surrounding spaces from the city and write it in lower case.
- rule_id: R4_fill_median_weight
  table: products
  column: product_weight_g
  action: fill_median
  params: {}
  description: Replace a missing product weight with the median weight.
