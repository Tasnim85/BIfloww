# English catalog: the CANONICAL language (contracts and audit journal).
# Every key must also exist in fr.yaml with the same placeholders (tests/test_i18n.py checks it).
# Syntax of the placeholders: contracts/i18n.py

word:
  current: "current"
  previous: "previous"
  and: "and"
  far_above: "far above"
  above: "above"
  far_below: "far below"
  below: "below"
  close_to: "close to"
  equal_to: "equal to"

cmp:                                  # BO4-12, comparisons/checks.py
  coverage:
    ok: "Both periods have complete data on every day."
    none: "The {which:t} period ({start} to {end}) has no complete day: at most {max_rows:int} {what} per day, against a usual {median:f0}."
    before: "The {which:t} period ({start} to {end}) is complete only from {cstart} to {cend}: before {cstart} the volume falls to between {lo:int} and {hi:int} {what} per day, against a usual {median:f0}."
    after: "The {which:t} period ({start} to {end}) is complete only from {cstart} to {cend}: after {cend} the volume falls to between {lo:int} and {hi:int} {what} per day, against a usual {median:f0}."
    both: "The {which:t} period ({start} to {end}) is complete only from {cstart} to {cend}: before {cstart} and after {cend} the volume falls to between {lo:int} and {hi:int} {what} per day, against a usual {median:f0}."
    as_asked: "The comparison as asked ({chg:spct}) compares {n_cur:int} complete days with {n_prev:int}."
  population:
    status_share: "{cur:pct} of the current period's rows are '{status}', against {prev:pct} in the previous one: the KPI keeps a different share of each period."
    only_current: "Some {label} values appear in one period only (only in the current period: {only_cur})."
    only_previous: "Some {label} values appear in one period only (only in the previous period: {only_prev})."
    only_both: "Some {label} values appear in one period only (only in the current period: {only_cur}; only in the previous period: {only_prev})."
    ok: "Same population on both sides: {scope}."
  unit:
    blocking: "The analysis is in {result_unit} but {kpi_ref} is defined in {kpi_unit}."
    warning: "The analysis used {result_kpi} but the catalog now defines {kpi_ref}."
    ok: "Both values are in {unit} ({kpi_ref})."
  scale:
    not_total: "{kpi} is not a total, so period length does not bias it."
    ok: "Periods of {n_cur:int} and {n_prev:int} days: lengths are comparable."
    different: "{kpi} is a total and the periods last {n_cur:int} and {n_prev:int} days ({gap:pct0} difference): the longer period wins partly because it is longer."
  grain:
    mismatch: "{kpi_ref} expects one row per {kpi_grain} but {table} has one row per {table_grain}."
    join_duplicates: "Building {table} turned {before:int} rows into {after:int}: the join on {keys} duplicated rows."
    duplicate_keys: "{dups:int} rows of {table} share a primary key {pk}."
    ok: "Both values come from {table} (one row = one {grain}), with no duplicated rows."

fix:                                  # BO4-12, comparisons/fix.py
  unit: "{unit}"
  unit_per_day: "{unit}/day"
  same_days: "Compare days {first:int} to {last:int} of both periods: {a_start}..{a_end} with {b_start}..{b_end}."
  per_day: "Compare {kpi} per day: {a_start}..{a_end} ({na:int} days) with {b_start}..{b_end} ({nb:int} days)."
  why_same_days: "Days {first:int} to {last:int} are complete in both periods ({n:int} days). Using the same days compares equal amounts of time."
  why_per_day: "Uses every complete day of both periods ({na:int} and {nb:int} days). In the previous period, {outside:pct} of the value falls on days the same-days comparison leaves out."
  why_lengths: "The periods have different lengths ({n_cur:int} and {n_prev:int} days). A daily average removes the length effect."
  why_first_days: "Keeps totals but uses only the first {n:int} days of each period."

summary:                              # BO4-12, comparisons/narrate.py (template summary)
  asked: "{metric} {p_start}..{p_end} = {v_cur:num2} {unit} against {c_start}..{c_end} = {v_prev:num2} {unit} ({chg:spct})"
  valid: "The comparison is valid: {asked:msg}."
  misleading: "Careful: this comparison is misleading as asked: {asked:msg}."
  note: "Note: {asked:msg}."
  recommended: "Recommended: {what:msg} Result: {v_cur:num2} {unit:msg} against {v_prev:num2} {unit:msg} ({chg:spct}). Why: {why:msg}"
  alternative: "Alternative: {what:msg} Result: {v_cur:num2} {unit:msg} against {v_prev:num2} {unit:msg} ({chg:spct}). Why: {why:msg}"
  no_fix: "No honest adjustment exists with this data: the comparison should not be shown."
  wait: "Nothing is changed until you choose."
  none: "No comparison was requested: nothing to check."

shap:                                 # BO3, auditor/xai/narrator.py
  ordinary: "Not flagged. The model needed {splits:f1} splits to isolate this row, versus {typical:f1} for a typical row. It looks like an ordinary observation: no feature pushed it meaningfully toward anomaly."
  nothing: "No single feature stands out; the model's score is close to a typical row."
  reason: "{label} ({value:auto}{unit}, {position:t} the typical {typical:auto}{unit}) accounted for {share:pct0} of the push toward anomaly"
  flagged: "Flagged as anomalous because {reasons:msg}. The model isolated this row in {splits:f1} splits, versus {typical:f1} for a typical row."
  not_flagged: "Not flagged. The most unusual aspects were {reasons:msg}, but not enough to cross the anomaly threshold. Isolation took {splits:f1} splits versus {typical:f1} for a typical row."

drift:                                # BO3, auditor/drift/monitor.py
  input: "{agent}.{name} (PSI {psi:f2})"
  output: "{agent}.{name} = {value:f4} (limits {lower:f4} to {upper:f4})"
  data_drift: "{run}: the input data changed ({inputs:msgs}) and the outputs changed too ({outputs:msgs}). The decisions most likely follow the data. Check that this change is legitimate."
  data_drift_only: "{run}: the input data changed ({inputs:msgs}) but no output left its limits. The models may no longer fit the data: keep watching."
  agent_changed: "{run}: the input data is stable, yet the behaviour of {agents} changed ({outputs:msgs})."
  why_setting: "The explanations of {explained} show the same reasoning as usual, so a SETTING changed (for example a threshold), not the model itself."
  why_unknown: "A setting, a filter or a processing step probably changed."
  model_changed: "{run}: the input data is stable, yet the model weighs its features differently ({outputs:msgs}). The model itself was probably changed or retrained."
  stable: "{run}: inputs and outputs are within the reference limits."
  caution: "This is a diagnosis, not a proof: a human decides."
  not_available: "Drift monitoring needs at least 3 reference runs (params['drift_reference']); not computed."

why:                                  # BO3, auditor/why.py (deterministic fallback)
  fallback: "Automatic answer ({reason}). {intro:t}:"
  matches: "Decisions recorded for this run that match the question"
  no_match: "No entry matches the question's words; notable decisions of the run"

