# Catalogue français. Mêmes clés et mêmes {placeholders} que en.yaml (vérifié par tests/test_i18n.py).
# Les nombres sont formatés par le code (1 234,56 et +34,6 %) : ne jamais les écrire ici.

word:
  current: "étudiée"
  previous: "de comparaison"
  and: "et"
  far_above: "bien au-dessus de"
  above: "au-dessus de"
  far_below: "bien en dessous de"
  below: "en dessous de"
  close_to: "proche de"
  equal_to: "égale à"

cmp:
  coverage:
    ok: "Les deux périodes ont des données complètes chaque jour."
    none: "La période {which:t} ({start} au {end}) n'a aucun jour complet : au plus {max_rows:int} {what} par jour, contre {median:f0} habituellement."
    before: "La période {which:t} ({start} au {end}) n'est complète que du {cstart} au {cend} : avant le {cstart}, le volume tombe entre {lo:int} et {hi:int} {what} par jour, contre {median:f0} habituellement."
    after: "La période {which:t} ({start} au {end}) n'est complète que du {cstart} au {cend} : après le {cend}, le volume tombe entre {lo:int} et {hi:int} {what} par jour, contre {median:f0} habituellement."
    both: "La période {which:t} ({start} au {end}) n'est complète que du {cstart} au {cend} : avant le {cstart} et après le {cend}, le volume tombe entre {lo:int} et {hi:int} {what} par jour, contre {median:f0} habituellement."
    as_asked: "La comparaison demandée ({chg:spct}) compare {n_cur:int} jours complets à {n_prev:int}."
  population:
    status_share: "{cur:pct} des lignes de la période étudiée sont « {status} », contre {prev:pct} dans la période de comparaison : le KPI ne retient pas la même part de chaque période."
    only_current: "Certaines valeurs de « {label} » n'apparaissent que dans une période (uniquement dans la période étudiée : {only_cur})."
    only_previous: "Certaines valeurs de « {label} » n'apparaissent que dans une période (uniquement dans la période de comparaison : {only_prev})."
    only_both: "Certaines valeurs de « {label} » n'apparaissent que dans une période (uniquement dans la période étudiée : {only_cur} ; uniquement dans la période de comparaison : {only_prev})."
    ok: "Même population des deux côtés : {scope}."
  unit:
    blocking: "L'analyse est en {result_unit} mais {kpi_ref} est défini en {kpi_unit}."
    warning: "L'analyse a utilisé {result_kpi} mais le catalogue définit maintenant {kpi_ref}."
    ok: "Les deux valeurs sont en {unit} ({kpi_ref})."
  scale:
    not_total: "{kpi} n'est pas un total : la durée des périodes ne le biaise pas."
    ok: "Périodes de {n_cur:int} et {n_prev:int} jours : les durées sont comparables."
    different: "{kpi} est un total et les périodes durent {n_cur:int} et {n_prev:int} jours ({gap:pct0} d'écart) : la période la plus longue gagne en partie parce qu'elle est plus longue."
  grain:
    mismatch: "{kpi_ref} attend une ligne par {kpi_grain} mais {table} a une ligne par {table_grain}."
    join_duplicates: "La construction de {table} a transformé {before:int} lignes en {after:int} : la jointure sur {keys} a dupliqué des lignes."
    duplicate_keys: "{dups:int} lignes de {table} partagent une clé primaire {pk}."
    ok: "Les deux valeurs viennent de {table} (une ligne par {grain}), sans ligne dupliquée."

fix:
  unit: "{unit}"
  unit_per_day: "{unit}/jour"
  same_days: "Comparer les jours {first:int} à {last:int} des deux périodes : {a_start}..{a_end} avec {b_start}..{b_end}."
  per_day: "Comparer {kpi} par jour : {a_start}..{a_end} ({na:int} jours) avec {b_start}..{b_end} ({nb:int} jours)."
  why_same_days: "Les jours {first:int} à {last:int} sont complets dans les deux périodes ({n:int} jours). Prendre les mêmes jours compare des durées égales."
  why_per_day: "Utilise tous les jours complets des deux périodes ({na:int} et {nb:int} jours). Dans la période de comparaison, {outside:pct} de la valeur tombe sur des jours que la comparaison « mêmes jours » laisse de côté."
  why_lengths: "Les périodes n'ont pas la même durée ({n_cur:int} et {n_prev:int} jours). Une moyenne par jour supprime l'effet de durée."
  why_first_days: "Garde des totaux mais n'utilise que les {n:int} premiers jours de chaque période."

summary:
  asked: "{metric} {p_start}..{p_end} = {v_cur:num2} {unit} contre {c_start}..{c_end} = {v_prev:num2} {unit} ({chg:spct})"
  valid: "La comparaison est valide : {asked:msg}."
  misleading: "Attention : cette comparaison est trompeuse telle que demandée : {asked:msg}."
  note: "À noter : {asked:msg}."
  recommended: "Recommandé : {what:msg} Résultat : {v_cur:num2} {unit:msg} contre {v_prev:num2} {unit:msg} ({chg:spct}). Pourquoi : {why:msg}"
  alternative: "Alternative : {what:msg} Résultat : {v_cur:num2} {unit:msg} contre {v_prev:num2} {unit:msg} ({chg:spct}). Pourquoi : {why:msg}"
  no_fix: "Aucun ajustement honnête n'existe avec ces données : la comparaison ne doit pas être affichée."
  wait: "Rien n'est modifié tant que vous n'avez pas choisi."
  none: "Aucune comparaison n'a été demandée : rien à vérifier."

shap:
  ordinary: "Non signalée. Le modèle a eu besoin de {splits:f1} coupes pour isoler cette ligne, contre {typical:f1} pour une ligne typique. C'est une observation ordinaire : aucune variable ne l'a poussée nettement vers l'anomalie."
  nothing: "Aucune variable ne se distingue : le score du modèle est proche de celui d'une ligne typique."
  reason: "{label} ({value:auto}{unit}, {position:t} la valeur typique de {typical:auto}{unit}) représente {share:pct0} de la poussée vers l'anomalie"
  flagged: "Signalée comme anomalie car {reasons:msg}. Le modèle a isolé cette ligne en {splits:f1} coupes, contre {typical:f1} pour une ligne typique."
  not_flagged: "Non signalée. Les aspects les plus inhabituels sont {reasons:msg}, mais pas assez pour franchir le seuil d'anomalie. L'isolement a pris {splits:f1} coupes contre {typical:f1} pour une ligne typique."

drift:
  input: "{agent}.{name} (PSI {psi:f2})"
  output: "{agent}.{name} = {value:f4} (limites {lower:f4} à {upper:f4})"
  data_drift: "{run} : les données d'entrée ont changé ({inputs:msgs}) et les sorties aussi ({outputs:msgs}). Les décisions suivent très probablement les données. Vérifiez que ce changement est légitime."
  data_drift_only: "{run} : les données d'entrée ont changé ({inputs:msgs}) mais aucune sortie n'a quitté ses limites. Les modèles risquent de ne plus correspondre aux données : à surveiller."
  agent_changed: "{run} : les données d'entrée sont stables, pourtant le comportement a changé pour : {agents} ({outputs:msgs})."
  why_setting: "Les explications SHAP ({explained}) montrent le même raisonnement que d'habitude : c'est donc un RÉGLAGE qui a changé (par exemple un seuil), pas le modèle lui-même."
  why_unknown: "Un réglage, un filtre ou une étape de traitement a probablement changé."
  model_changed: "{run} : les données d'entrée sont stables, pourtant le modèle pondère ses variables autrement ({outputs:msgs}). Le modèle lui-même a probablement été modifié ou réentraîné."
  stable: "{run} : les entrées et les sorties restent dans les limites de référence."
  caution: "C'est un diagnostic, pas une preuve : un humain décide."
  not_available: "La surveillance du drift demande au moins 3 runs de référence (params['drift_reference']) : non calculée."

why:
  fallback: "Réponse automatique ({reason}). {intro:t} :"
  matches: "Décisions enregistrées pour ce run qui correspondent à la question"
  no_match: "Aucune entrée ne correspond aux mots de la question ; décisions notables du run"

