# classification_rules.yaml --- Step 2 Rule-Based Classification Rules
# Owner : Malek (BIFlow Step 2)
# Format: list of rule dicts; loaded by RuleBasedClassifier
#
# Each rule:
#   rule_id:    unique identifier (SCREAMING_SNAKE_CASE)
#   priority:   integer -- lower = higher priority (0 = highest)
#   group_id:   taxonomy group_id (must match semantic_types.yaml)
#   type_id:    taxonomy type_id (must match semantic_types.yaml)
#   match:
#     keywords:       list of strings matched against normalized tokens or column name
#     table_hints:    (optional) only apply if table name contains one of these
#     value_patterns: (optional) regex patterns applied to sample values
#   confidence: float in [0, 1]
#   notes:      human-readable description

rules:

  # FIX 1: ID-suffix override - any *_id column is an identifier, not text.
  # Fixes: review_id -> TEXT(PII=True), order_item_id -> QUANTITY(PII=False)
  - rule_id: ID_SUFFIX_OVERRIDE_RULE
    priority: 0
    group_id: TECHNICAL_DATA
    type_id:  SYSTEM_ID
    match:
      keywords:
        - _id
      value_patterns:
        - '^[0-9a-f-]{8,}$'
        - '^[0-9]+$'
    confidence: 0.91
    notes: >
      Any column whose normalised name ends with _id is an identifier regardless
      of prefix context (review_id, order_item_id, session_id).
      Priority 0 fires before all domain rules. Fixes: review_id was TEXT(PII).

  # FIX 2: customer_unique_id must be PERSON_ID (PII=True), not SYSTEM_ID.
  # Fixes: customer_unique_id was SYSTEM_ID(PII=False) in Step 2.
  - rule_id: CUSTOMER_ID_OVERRIDE_RULE
    priority: -1
    group_id: PERSONAL_DATA
    type_id:  PERSON_ID
    match:
      keywords:
        - customer_id
        - customer_unique_id
        - client_id
        - client_unique_id
        - buyer_id
        - member_id
        - subscriber_id
    confidence: 0.93
    notes: >
      Customer-scoped identifiers are PERSON_ID (pii_candidate=True). Overrides
      generic SYSTEM_ID rule. Fixes: customer_unique_id was PII=False in Step 2.

  # FIX 3: payment_installments is QUANTITY (PII=False), not a personal ID.
  # Fixes: payment_installments was NUMBER(PII=True) in Step 2.
  - rule_id: INSTALLMENTS_RULE
    priority: 0
    group_id: QUANTITATIVE_DATA
    type_id:  QUANTITY
    match:
      keywords:
        - installment
        - installments
        - parcelas
        - nb_echeances
        - payment_installments
        - num_installments
    confidence: 0.90
    notes: >
      Number of payment installments is a QUANTITY (pii_candidate=False).
      Fixes: payment_installments was mis-classified as NUMBER(PII=True).

  - rule_id: EMAIL_RULE

    priority: 1

    group_id: PERSONAL_DATA

    type_id:  EMAIL

    match:

      keywords: [email, mail, e_mail, courriel, email_address]

      value_patterns:

        - "^[\\w.+-]+@[\\w-]+\\.[a-z]{2,}$"

    confidence: 0.92

    notes: "Email address columns"



  - rule_id: PHONE_RULE

    priority: 2

    group_id: PERSONAL_DATA

    type_id:  PHONE

    match:

      keywords: [phone, telephone, mobile, tel, fax, gsm, handphone, cellphone]

      value_patterns:

        - "^[+]?[0-9 \\-().]{7,20}$"

    confidence: 0.90

    notes: "Phone/mobile number columns"



  - rule_id: PERSON_NAME_RULE

    priority: 3

    group_id: PERSONAL_DATA

    type_id:  PERSON_NAME

    match:

      keywords: [first_name, last_name, full_name, firstname, lastname, surname, prenom, nom_client]

    confidence: 0.90

    notes: "Full or partial personal name columns"



  - rule_id: PERSON_ID_RULE

    priority: 4

    group_id: PERSONAL_DATA

    type_id:  PERSON_ID

    match:

      keywords: [customer_id, client_id, user_id, person_id, buyer_id, account_id, member_id, subscriber_id]

    confidence: 0.90

    notes: "Person/customer identifier columns"



  - rule_id: AGE_RULE

    priority: 5

    group_id: PERSONAL_DATA

    type_id:  AGE

    match:

      keywords: [age, years_old, client_age]

      value_patterns:

        - "^(1[0-2][0-9]|[1-9][0-9]|[0-9])$"

    confidence: 0.88

    notes: "Age in years"



