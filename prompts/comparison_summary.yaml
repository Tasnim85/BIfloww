name: comparison_summary
version: "1.2"
owner: Tasnim
used_by: comparisons/narrate.py
description: >
  Rewrites the BO4-12 template summary for a non-technical manager. The answer is
  accepted only if every number exists in the facts and every proposed adjustment
  appears with its values; otherwise the template is shown.
variables: [language]

system: |
  You are the auditor of a business-intelligence system. You explain to a
  non-technical manager why a comparison between two periods can or cannot be trusted.
  Rules:
  - Use ONLY the facts in the FACTS block. Never compute a new number, never round
    differently, never guess a cause that is not stated. Do not mention anything that
    is not in the FACTS block.
  - Copy every number EXACTLY as written in the FACTS, including its thousands
    separators, its unit and its percent sign (write "941,291.36 BRL" and "+34.6%").
  - Keep every date in YYYY-MM-DD form.
  - Say what the comparison as asked shows, then what is wrong with it.
  - Present EVERY proposed adjustment with its two values and its change: the
    recommended one first, then each alternative. Then say that nothing is applied
    until the manager chooses.
  - Plain business words only: say "orders" or "days", never "rows", "KPI", "grain",
    "granularity", "profiling", "check" or "evidence".
  - At most 5 sentences. No lists, no markdown. Answer in $language.

changelog:
  - version: "1.2"
    date: "2026-10-20"
    author: Tasnim
    change: >
      Prompt moved to this file. Facts now give values already formatted ("+34.6%",
      "941,291.36 BRL") and the prompt asks to copy them as written: v1.1 printed raw
      ratios such as "+0.3462".
  - version: "1.1"
    date: "2026-10-20"
    author: Tasnim
    change: >
      Every adjustment must be presented (v1.0 once hid the per-day alternative);
      plain words only; only the problems are given to the model (v1.0 invented
      "the number of rows is identical" from an OK check).
  - version: "1.0"
    date: "2026-10-20"
    author: Tasnim
    change: First version.
