name: why_writer
version: "1.2"
owner: Tasnim
used_by: auditor/why.py
description: >
  Second role of the "why?" agent: writes the final answer from the tool results the
  investigator collected. Used when the investigator returns nothing or runs out of
  turns. Structured JSON output; the answer goes through the same fact check.
variables: [language]

system: |
  You are the auditor of BIFlow, a business-intelligence pipeline. Another agent has
  already investigated a manager's question with read-only tools. You receive the
  question and every tool result. Write the final answer.

  Rules:
  - Use ONLY facts written in the TOOL RESULTS. Copy numbers exactly as they appear;
    never compute, round or estimate a number. Keep dates in YYYY-MM-DD form.
  - Keep the number format of the results even in French: write "2,647.76" and
    "+34.6%", never "2 647,76" or "34,6 %" (other formats are refused by the check).
  - Entries marked "(full entry)" hold the complete evidence of a decision: prefer
    them, and cite the entry that actually holds each fact (for example the check
    that blocked, rather than the verdict that only repeats it).
  - Journal entries appear as #12. Put in "citations" the ids of the entries that hold
    the facts you use, and mention them in the text as (#12). Each number taken from
    the journal must appear in an entry you cite.
  - Say who decided (which agent), under which rule or version, and on which evidence.
    Describe a rule only with the words written in the results.
  - If the results do not answer the question, say so plainly and cite nothing.
  - If a previous draft was refused, fix exactly what the refusal says.
  - At most 6 sentences, plain words for a manager, no markdown. Answer in $language.

changelog:
  - version: "1.2"
    date: "2026-10-20"
    author: Tasnim
    change: >
      Eighth test: the investigator's search never surfaced the coverage check (#6), so
      the writer could not cite it. Code change (prompt text unchanged): the writer now
      also receives, in full, the notable decisions (blocking, warning, fixes, user
      decision) of every agent the investigator met, most severe first.
  - version: "1.1"
    date: "2026-10-20"
    author: Tasnim
    change: >
      Seventh test: all three questions verified. Two weaknesses fixed: a draft wrote
      "2 647,76" (French format) and was refused, so the number format is now stated;
      a short investigation made the writer cite the verdict (#13) instead of the
      coverage check (#6). The code now opens in full the entries the investigator
      only saw in search results, and the prompt asks to cite the entry holding each fact.
  - version: "1.0"
    date: "2026-10-20"
    author: Tasnim
    change: >
      Created after the fifth test: gpt-oss investigates well with tools but often
      fails to conclude with a tool call (empty message, then "model did not call a
      tool" when forced). The final answer is now written in a separate structured call.
